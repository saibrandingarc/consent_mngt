# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# Environments:
#   local  → .env (pnpm dev)
#   dev    → push to `dev`  → App Service consentmngtdev
#   main   → push to `main` → App Service consentmngt (set AZURE_PROD_* vars/secrets)

name: Build and deploy CMP to Azure

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Azure environment
        required: true
        type: choice
        options:
          - development
          - production

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      cmp_env: ${{ steps.env.outputs.cmp_env }}
      site_url: ${{ steps.env.outputs.site_url }}
      app_name: ${{ steps.env.outputs.app_name }}
    steps:
      - id: env
        env:
          REF: ${{ github.ref_name }}
          DISPATCH_ENV: ${{ github.event.inputs.environment }}
          DEV_URL: ${{ vars.AZURE_DEV_URL }}
          PROD_URL: ${{ vars.AZURE_PROD_URL }}
          DEV_APP: ${{ vars.AZURE_DEV_APP_NAME }}
          PROD_APP: ${{ vars.AZURE_PROD_APP_NAME }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMP_ENV="$DISPATCH_ENV"
          elif [ "$REF" = "main" ]; then
            CMP_ENV=production
          else
            CMP_ENV=development
          fi
          if [ "$CMP_ENV" = "production" ]; then
            SITE_URL="${PROD_URL:-https://consentmngt.azurewebsites.net}"
            APP_NAME="${PROD_APP:-consentmngt}"
          else
            SITE_URL="${DEV_URL:-https://consentmngtdev-gtfgamd4c9b4bbcr.eastus2-01.azurewebsites.net}"
            APP_NAME="${DEV_APP:-consentmngtdev}"
          fi
          echo "cmp_env=$CMP_ENV" >> "$GITHUB_OUTPUT"
          echo "site_url=$SITE_URL" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "Deploy target: $CMP_ENV → $APP_NAME ($SITE_URL)"

  build:
    runs-on: ubuntu-latest
    needs: configure
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.6.0 --activate

      - name: Install, build API + web, assemble Azure site
        env:
          CM_DATABASE_URL: sqlserver://localhost:1433;database=cmp;user=sa;password=Placeholder_1;encrypt=true;trustServerCertificate=true
          PRISMA_GENERATE_SKIP_AUTOINSTALL: 'true'
          NEXT_PUBLIC_API_URL: ${{ needs.configure.outputs.site_url }}/api/v1
          APP_BASE_URL: ${{ needs.configure.outputs.site_url }}
          WEB_URL: ${{ needs.configure.outputs.site_url }}
          ADMIN_URL: ${{ needs.configure.outputs.site_url }}
          API_PUBLIC_URL: ${{ needs.configure.outputs.site_url }}/api/v1
          AUTH0_SECRET: build-time-placeholder-secret-32chars
          AUTH0_DOMAIN: example.auth0.com
          AUTH0_CLIENT_ID: build-placeholder-client-id
          AUTH0_CLIENT_SECRET: build-placeholder-client-secret
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @cmp/database generate
          pnpm --filter @cmp/types build
          pnpm --filter @cmp/config build
          pnpm --filter @cmp/utils build
          pnpm --filter @cmp/validation build
          pnpm --filter @cmp/auth build
          pnpm --filter @cmp/sdk build
          pnpm --filter @cmp/database build
          pnpm --filter @cmp/api... build
          pnpm --filter @cmp/web... build
          pnpm --filter @cmp/admin... build
          pnpm --filter @cmp/api deploy --prod ./azure-api
          pnpm --filter @cmp/web deploy --prod ./azure-web
          pnpm --filter @cmp/admin deploy --prod ./azure-admin
          SCHEMA="$(find ./azure-api/node_modules -path '*/@cmp/database/prisma/schema.prisma' -print -quit)"
          test -n "$SCHEMA"
          SRC_CLIENT="$(find node_modules/.pnpm -type d -path '*@prisma+client@*/node_modules/.prisma/client' | head -1)"
          test -n "$SRC_CLIENT"
          mkdir -p azure-api/node_modules/.prisma
          rm -rf azure-api/node_modules/.prisma/client
          cp -R "$SRC_CLIENT" azure-api/node_modules/.prisma/client
          while IFS= read -r dest; do
            rm -rf "$dest"
            mkdir -p "$(dirname "$dest")"
            cp -R "$SRC_CLIENT" "$dest"
          done < <(find azure-api/node_modules -type d -path '*@prisma+client@*/node_modules/.prisma/client' 2>/dev/null || true)
          bash deploy/azure/assemble.sh

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: azure-site

  deploy:
    runs-on: ubuntu-latest
    needs: [configure, build]
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.configure.outputs.app_name }}
          slot-name: Production
          package: .
          publish-profile: ${{ needs.configure.outputs.cmp_env == 'production' && secrets.AZUREAPPSERVICE_PUBLISHPROFILE_PROD || secrets.AZUREAPPSERVICE_PUBLISHPROFILE_27B5213FF5AB4DDBB652DE4F7F0C857A }}
