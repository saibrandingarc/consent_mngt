# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# Environments:
#   local  → .env (pnpm dev) — still one monorepo, three processes
#   dev    → push to `dev`  → three App Services (web / api / admin)
#   main   → push to `main` → three production App Services
#
# Create three Node 22 Linux App Services per environment. Add publish-profile secrets:
#   DEV:  AZUREAPPSERVICE_PUBLISHPROFILE_WEB_DEV (falls back to existing 27B5213…)
#         AZUREAPPSERVICE_PUBLISHPROFILE_API_DEV
#         AZUREAPPSERVICE_PUBLISHPROFILE_ADMIN_DEV
#   PROD: AZUREAPPSERVICE_PUBLISHPROFILE_WEB_PROD (falls back to AZUREAPPSERVICE_PUBLISHPROFILE_PROD)
#         AZUREAPPSERVICE_PUBLISHPROFILE_API_PROD
#         AZUREAPPSERVICE_PUBLISHPROFILE_ADMIN_PROD

name: Build and deploy CMP to Azure

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Azure environment
        required: true
        type: choice
        options:
          - development
          - production

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      cmp_env: ${{ steps.env.outputs.cmp_env }}
      web_url: ${{ steps.env.outputs.web_url }}
      api_url: ${{ steps.env.outputs.api_url }}
      admin_url: ${{ steps.env.outputs.admin_url }}
      web_app: ${{ steps.env.outputs.web_app }}
      api_app: ${{ steps.env.outputs.api_app }}
      admin_app: ${{ steps.env.outputs.admin_app }}
    steps:
      - id: env
        env:
          REF: ${{ github.ref_name }}
          DISPATCH_ENV: ${{ github.event.inputs.environment }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMP_ENV="$DISPATCH_ENV"
          elif [ "$REF" = "main" ]; then
            CMP_ENV=production
          else
            CMP_ENV=development
          fi
          if [ "$CMP_ENV" = "production" ]; then
            WEB_URL="${{ vars.AZURE_PROD_WEB_URL || vars.AZURE_PROD_URL || 'https://consentmngt.azurewebsites.net' }}"
            API_URL="${{ vars.AZURE_PROD_API_URL || 'https://consentmngt-api.azurewebsites.net' }}"
            ADMIN_URL="${{ vars.AZURE_PROD_ADMIN_URL || 'https://consentmngt-admin.azurewebsites.net' }}"
            WEB_APP="${{ vars.AZURE_PROD_WEB_APP || vars.AZURE_PROD_APP_NAME || 'consentmngt' }}"
            API_APP="${{ vars.AZURE_PROD_API_APP || 'consentmngt-api' }}"
            ADMIN_APP="${{ vars.AZURE_PROD_ADMIN_APP || 'consentmngt-admin' }}"
          else
            WEB_URL="${{ vars.AZURE_DEV_WEB_URL || vars.AZURE_DEV_URL || 'https://consentmngtdev-gtfgamd4c9b4bbcr.eastus2-01.azurewebsites.net' }}"
            API_URL="${{ vars.AZURE_DEV_API_URL || 'https://consentmngtdev-api.azurewebsites.net' }}"
            ADMIN_URL="${{ vars.AZURE_DEV_ADMIN_URL || 'https://consentmngtdev-admin.azurewebsites.net' }}"
            WEB_APP="${{ vars.AZURE_DEV_WEB_APP || vars.AZURE_DEV_APP_NAME || 'consentmngtdev' }}"
            API_APP="${{ vars.AZURE_DEV_API_APP || 'consentmngtdev-api' }}"
            ADMIN_APP="${{ vars.AZURE_DEV_ADMIN_APP || 'consentmngtdev-admin' }}"
          fi
          echo "cmp_env=$CMP_ENV" >> "$GITHUB_OUTPUT"
          echo "web_url=$WEB_URL" >> "$GITHUB_OUTPUT"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "admin_url=$ADMIN_URL" >> "$GITHUB_OUTPUT"
          echo "web_app=$WEB_APP" >> "$GITHUB_OUTPUT"
          echo "api_app=$API_APP" >> "$GITHUB_OUTPUT"
          echo "admin_app=$ADMIN_APP" >> "$GITHUB_OUTPUT"
          echo "Deploy $CMP_ENV web=$WEB_APP api=$API_APP admin=$ADMIN_APP"

  build:
    runs-on: ubuntu-latest
    needs: configure
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js version
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.6.0 --activate

      - name: Install, build, assemble three Azure sites
        env:
          CM_DATABASE_URL: sqlserver://localhost:1433;database=cmp;user=sa;password=Placeholder_1;encrypt=true;trustServerCertificate=true
          PRISMA_GENERATE_SKIP_AUTOINSTALL: 'true'
          NEXT_PUBLIC_API_URL: ${{ needs.configure.outputs.api_url }}/api/v1
          APP_BASE_URL: ${{ needs.configure.outputs.web_url }}
          WEB_URL: ${{ needs.configure.outputs.web_url }}
          ADMIN_URL: ${{ needs.configure.outputs.admin_url }}
          API_PUBLIC_URL: ${{ needs.configure.outputs.api_url }}/api/v1
          AUTH0_SECRET: build-time-placeholder-secret-32chars
          AUTH0_DOMAIN: example.auth0.com
          AUTH0_CLIENT_ID: build-placeholder-client-id
          AUTH0_CLIENT_SECRET: build-placeholder-client-secret
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @cmp/database generate
          pnpm --filter @cmp/types build
          pnpm --filter @cmp/config build
          pnpm --filter @cmp/utils build
          pnpm --filter @cmp/validation build
          pnpm --filter @cmp/auth build
          pnpm --filter @cmp/sdk build
          pnpm --filter @cmp/database build
          pnpm --filter @cmp/api... build
          pnpm --filter @cmp/web... build
          pnpm --filter @cmp/admin... build
          pnpm --filter @cmp/api deploy --prod ./azure-api
          pnpm --filter @cmp/web deploy --prod ./azure-web
          pnpm --filter @cmp/admin deploy --prod ./azure-admin
          SCHEMA="$(find ./azure-api/node_modules -path '*/@cmp/database/prisma/schema.prisma' -print -quit)"
          test -n "$SCHEMA"
          SRC_CLIENT="$(find node_modules/.pnpm -type d -path '*@prisma+client@*/node_modules/.prisma/client' | head -1)"
          test -n "$SRC_CLIENT"
          mkdir -p azure-api/node_modules/.prisma
          rm -rf azure-api/node_modules/.prisma/client
          cp -R "$SRC_CLIENT" azure-api/node_modules/.prisma/client
          while IFS= read -r dest; do
            rm -rf "$dest"
            mkdir -p "$(dirname "$dest")"
            cp -R "$SRC_CLIENT" "$dest"
          done < <(find azure-api/node_modules -type d -path '*@prisma+client@*/node_modules/.prisma/client' 2>/dev/null || true)
          bash deploy/azure/assemble.sh

      - uses: actions/upload-artifact@v6
        with:
          name: cmp-api
          path: azure-site-api

      - uses: actions/upload-artifact@v6
        with:
          name: cmp-web
          path: azure-site-web

      - uses: actions/upload-artifact@v6
        with:
          name: cmp-admin
          path: azure-site-admin

  deploy-web:
    runs-on: ubuntu-latest
    needs: [configure, build]
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: cmp-web
      - uses: azure/webapps-deploy@v3.0.8
        with:
          app-name: ${{ needs.configure.outputs.web_app }}
          slot-name: Production
          package: .
          publish-profile: ${{ needs.configure.outputs.cmp_env == 'production' && (secrets.AZUREAPPSERVICE_PUBLISHPROFILE_WEB_PROD || secrets.AZUREAPPSERVICE_PUBLISHPROFILE_PROD) || (secrets.AZUREAPPSERVICE_PUBLISHPROFILE_WEB_DEV || secrets.AZUREAPPSERVICE_PUBLISHPROFILE_27B5213FF5AB4DDBB652DE4F7F0C857A) }}

  deploy-api:
    runs-on: ubuntu-latest
    needs: [configure, build]
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: cmp-api
      - uses: azure/webapps-deploy@v3.0.8
        with:
          app-name: ${{ needs.configure.outputs.api_app }}
          slot-name: Production
          package: .
          publish-profile: ${{ needs.configure.outputs.cmp_env == 'production' && secrets.AZUREAPPSERVICE_PUBLISHPROFILE_API_PROD || secrets.AZUREAPPSERVICE_PUBLISHPROFILE_API_DEV }}

  deploy-admin:
    runs-on: ubuntu-latest
    needs: [configure, build]
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: cmp-admin
      - uses: azure/webapps-deploy@v3.0.8
        with:
          app-name: ${{ needs.configure.outputs.admin_app }}
          slot-name: Production
          package: .
          publish-profile: ${{ needs.configure.outputs.cmp_env == 'production' && secrets.AZUREAPPSERVICE_PUBLISHPROFILE_ADMIN_PROD || secrets.AZUREAPPSERVICE_PUBLISHPROFILE_ADMIN_DEV }}
