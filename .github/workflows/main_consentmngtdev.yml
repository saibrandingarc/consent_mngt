# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - consentmngtdev

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.6.0 --activate

      - name: Install, build API + web, assemble Azure site
        env:
          CM_DATABASE_URL: sqlserver://localhost:1433;database=cmp;user=sa;password=Placeholder_1;encrypt=true;trustServerCertificate=true
          PRISMA_GENERATE_SKIP_AUTOINSTALL: 'true'
          NEXT_PUBLIC_API_URL: https://consentmngtdev-gtfgamd4c9b4bbcr.eastus2-01.azurewebsites.net/api/v1
          APP_BASE_URL: https://consentmngtdev-gtfgamd4c9b4bbcr.eastus2-01.azurewebsites.net
          WEB_URL: https://consentmngtdev-gtfgamd4c9b4bbcr.eastus2-01.azurewebsites.net
          ADMIN_URL: http://localhost:3001
          AUTH0_SECRET: build-time-placeholder-secret-32chars
          AUTH0_DOMAIN: example.auth0.com
          AUTH0_CLIENT_ID: build-placeholder-client-id
          AUTH0_CLIENT_SECRET: build-placeholder-client-secret
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @cmp/database generate
          pnpm --filter @cmp/types build
          pnpm --filter @cmp/config build
          pnpm --filter @cmp/utils build
          pnpm --filter @cmp/validation build
          pnpm --filter @cmp/auth build
          pnpm --filter @cmp/sdk build
          pnpm --filter @cmp/database build
          pnpm --filter @cmp/api... build
          pnpm --filter @cmp/web... build
          pnpm --filter @cmp/api deploy --prod ./azure-api
          SCHEMA="$(find ./azure-api/node_modules -path '*/@cmp/database/prisma/schema.prisma' -print -quit)"
          test -n "$SCHEMA"
          SRC_CLIENT="$(find node_modules/.pnpm -type d -path '*@prisma+client@*/node_modules/.prisma/client' | head -1)"
          test -n "$SRC_CLIENT"
          mkdir -p azure-api/node_modules/.prisma
          rm -rf azure-api/node_modules/.prisma/client
          cp -R "$SRC_CLIENT" azure-api/node_modules/.prisma/client
          while IFS= read -r dest; do
            rm -rf "$dest"
            mkdir -p "$(dirname "$dest")"
            cp -R "$SRC_CLIENT" "$dest"
          done < <(find azure-api/node_modules -type d -path '*@prisma+client@*/node_modules/.prisma/client' 2>/dev/null || true)
          bash deploy/azure/assemble.sh

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: azure-site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'consentmngtdev'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_27B5213FF5AB4DDBB652DE4F7F0C857A }}
